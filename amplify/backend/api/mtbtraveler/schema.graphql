# This "input" configures a global authorization rule to enable public access to
# all models in this schema. Learn more about authorization rules here: https://docs.amplify.aws/cli/graphql/authorization-rules
# input AMPLIFY { globalAuthRule: AuthRule = { allow: public } } # FOR TESTING ONLY!

type UserProfile @model @auth(rules: [{ allow: owner }]) {
  id: ID!
  owner: String! @index(name: "byOwner", queryField: "userProfilesByOwner")
  name: String
  Location: String
  Language: String
  Currency: String
  profileImage: String
  Wishlist: [Destination] @hasMany(indexName: "byUserProfile", fields: ["id"])
}

type Destination
  @model
  @auth(
    rules: [
      { allow: owner }
      { allow: private }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  Location: String
  Language: String
  Currency: String
  Image: String
  Trails: [String]
  userProfileID: ID @index(name: "byUserProfile", sortKeyFields: ["Location"])
}
